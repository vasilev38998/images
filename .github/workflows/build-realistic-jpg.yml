name: Build realistic JPG cards

on:
  push:
    branches: [main]
    paths:
      - '.source/realistic_contact.jpg'
      - 'scripts/crop_realistic.py'
      - '.github/workflows/build-realistic-jpg.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Build realistic JPG cards
        run: python scripts/crop_realistic.py

      - name: Remove obsolete vector files and converter
        shell: bash
        run: |
          rm -f -- *.svg
          rm -f -- .github/workflows/convert-svg-to-jpg.yml

      - name: Commit regenerated cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Replace vector cards with realistic JPG photos"
          git push origin HEAD:main
