name: Build realistic JPG cards

on:
  push:
    branches: [main, realistic-fix2]
    paths:
      - '.source/realistic_parts/**'
      - 'scripts/build_realistic_from_parts.py'
      - '.github/workflows/build-realistic-jpg.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Build realistic JPG cards
        run: python scripts/build_realistic_from_parts.py

      - name: Commit regenerated cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.jpg'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Replace cards with realistic drink photos"
          git push origin HEAD:${GITHUB_REF_NAME}
